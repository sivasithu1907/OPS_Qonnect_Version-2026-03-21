  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
    <!-- Update banner — shown when a new app version has been installed in
         the background but this open tab is still running the old code.
         Previously there was no detection for this at all: skipWaiting()
         in sw.js makes a new service worker take over quickly, but nothing
         told the page itself to reload, so a PWA left open across a deploy
         could silently keep running old JavaScript indefinitely — no pull-
         to-refresh, no browser reload button available to work around it.
         Reloading automatically and silently would risk interrupting
         someone mid-job (e.g. a half-filled completion form), so this asks
         instead of forcing it. -->
    <div id="sw-update-banner" style="display:none;position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#0f172a;color:white;padding:12px 16px;align-items:center;justify-content:space-between;gap:12px;font-family:system-ui,sans-serif;font-size:13px;">
      <span>A new version is available.</span>
      <button onclick="window.location.reload()" style="background:#FFCC00;color:#0f172a;border:none;border-radius:8px;padding:8px 14px;font-weight:700;font-size:12px;cursor:pointer;">Refresh now</button>
    </div>
  <script type="module" src="/index.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      // Two previous attempts at detecting "a new version was deployed"
      // both relied on the controllerchange event firing only for genuine
      // updates. Confirmed directly against the live server that this
      // assumption is wrong — that event can fire for reasons unrelated to
      // an actual new deploy (exact browser timing/internals vary), so it
      // showed the banner on ordinary page loads with nothing new at all.
      //
      // This version checks the actual fact of the matter instead of
      // inferring it from an event: it records the version this page
      // loaded with, then independently re-checks the live sw.js content
      // against that recorded version. The banner only shows if those two
      // genuinely differ — not based on whether or why an event fired.
      let loadedVersion = null;

      const extractVersion = (text) => {
        const m = text.match(/CACHE_NAME\s*=\s*'([^']+)'/);
        return m ? m[1] : null;
      };

      const checkForNewVersion = async () => {
        try {
          const res = await fetch('/sw.js', { cache: 'no-store' });
          const text = await res.text();
          const liveVersion = extractVersion(text);
          if (loadedVersion === null) { loadedVersion = liveVersion; return; }
          if (liveVersion && liveVersion !== loadedVersion) {
            const banner = document.getElementById('sw-update-banner');
            if (banner) banner.style.display = 'flex';
          }
        } catch {
          // Network hiccup checking for an update is not worth surfacing —
          // just try again on the next trigger.
        }
      };

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('[SW] Registered:', reg.scope))
          .catch(err => console.warn('[SW] Registration failed:', err));
        checkForNewVersion(); // records loadedVersion on this page's first check
      });

      // Re-check whenever the tab becomes visible again — covers the real
      // case this banner exists for (PWA left open across a deploy) without
      // depending on controllerchange's exact firing semantics at all.
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') checkForNewVersion();
      });
    }
  </script>

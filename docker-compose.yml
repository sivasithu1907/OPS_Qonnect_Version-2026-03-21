services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fieldops
      POSTGRES_USER: fieldops
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fieldops_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldops -d fieldops"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-fieldops}
      DB_PASSWORD: ${DB_PASSWORD:-fieldops_pass}
      DB_NAME: ${DB_NAME:-fieldops}
      JWT_SECRET: ${JWT_SECRET}
      API_KEY: ${API_KEY}
      WA_ACCESS_TOKEN: ${WA_ACCESS_TOKEN:-}
      WA_PHONE_NUMBER_ID: ${WA_PHONE_NUMBER_ID:-}
      WA_VERIFY_TOKEN: ${WA_VERIFY_TOKEN:-}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://qonnectops.duckdns.org}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  postgres_data:
